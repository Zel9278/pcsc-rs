[package]
name = "pcsc-rs"
version = "2.6.0"
edition = "2024"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arc-swap = "=1.9.2"
cfg-if = "=1.0.5"
dotenvy = "=0.15.7"
# Only for the xp feature, which needs ring rather than aws-lc-rs
rustls = { version = "=0.23.45", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
# The TLS handshake is done in client.rs (with a timeout) instead of inside tungstenite
native_tls_crate = { package = "native-tls", version = "=0.2.18", optional = true }
# Releases are bare binaries; the HTTP client and TLS come from the native-tls or xp feature
self_update = { version = "=1.3.0", default-features = false, features = ["github"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tungstenite = { version = "=0.30.0", features = ["url"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["component", "disk", "multithread", "system"] }

[features]
default = ["native-tls"]
# TLS goes through native-tls for both the WebSocket and the updater
native-tls = [
    "dep:native_tls_crate",
    "tungstenite/native-tls",
    "self_update/reqwest",
    "self_update/native-tls",
    "dep:openssl",
]
# Windows XP build (`--target i686-pc-windows-msvc --no-default-features --features xp`).
# XP has no usable TLS stack and outdated roots, so TLS is rustls with ring and the
# bundled Mozilla roots, and the updater uses ureq, since reqwest's rustls needs
# aws-lc-rs and the system roots. VC-LTL5 and YY-Thunks are linked through
# thunk-rs, which needs curl and 7z unless VC_LTL and YY_THUNKS point at them.
xp = [
    "dep:rustls",
    "dep:thunk-rs",
    "tungstenite/rustls-tls-webpki-roots",
    "self_update/ureq",
    "self_update/rustls",
]

[build-dependencies]
git2 = { version = "=0.21.0", default-features = false }
thunk-rs = { version = "=0.3.5", optional = true, features = ["subsystem_windows"] }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Power"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
openssl = { version = "=0.10.81", optional = true, features = ["vendored"] }

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
