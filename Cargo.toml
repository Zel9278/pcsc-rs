[package]
name = "pcsc-rs"
version = "2.5.0"
edition = "2024"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arc-swap = "=1.9.2"
cfg-if = "=1.0.5"
dotenvy = "=0.15.7"
# Releases are bare binaries; TLS goes through native-tls like tungstenite
self_update = { version = "=1.3.0", default-features = false, features = ["github", "reqwest", "native-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tungstenite = { version = "=0.30.0", features = ["native-tls", "url"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["component", "disk", "multithread", "system"] }

[build-dependencies]
git2 = { version = "=0.21.0", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Power"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
openssl = { version = "=0.10.81", features = ["vendored"] }

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
