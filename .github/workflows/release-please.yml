on:
  push:
    branches:
      - main
  workflow_dispatch:

name: release-please

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          # The eoeo-org release app did not move with the repository; the
          # workflow token is enough (Actions may create pull requests here).
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please/release-please-config.json
          manifest-file: .release-please/.release-please-manifest.json
          skip-github-pull-request: ${{ startsWith(github.event.head_commit.message, 'release:') }}

  # The release commit may have created the tag before Actions was enabled.
  # Recover that tag once so the release and its binaries are still published.
  recover-v0-9-2:
    needs: release-please
    if: ${{ always() && needs.release-please.result == 'success' && needs.release-please.outputs.release_created != 'true' && startsWith(github.event.head_commit.message, 'ci: fix Android release') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create missing v0.9.2 release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: v0.9.2
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            assets=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
            if printf '%s\n' "$assets" | grep -Fxq "mimizk-rs-$TAG_NAME-android.apk" &&
              printf '%s\n' "$assets" | grep -Fxq "mimizk-rs-$TAG_NAME-android-legacy.apk"; then
              echo "release_created=false" >> "$GITHUB_OUTPUT"
            else
              echo "release_created=true" >> "$GITHUB_OUTPUT"
            fi
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "mimizk-rs v0.9.2" --generate-notes
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [release-please, recover-v0-9-2]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || needs.recover-v0-9-2.outputs.release_created == 'true') }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    # A called workflow gets no secrets otherwise (the Android signing key)
    secrets: inherit
    with:
      tag-name: ${{ needs.release-please.outputs.tag_name || needs.recover-v0-9-2.outputs.tag_name }}

  post-release:
    needs: build
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Create published label
        run: |
          gh label create 'autorelease: published' --color=EDEDED || :
      - name: Get PR number
        id: pr-number
        env:
          # Through the environment, not pasted into the script: quotes or % in the message broke it
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "pr_number=$(printf '%s\n' "$MESSAGE" | head -n1 | sed -nE 's/.+\(#([0-9]+)\)$/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Change labels on PR
        run: |
          gh pr edit ${{ steps.pr-number.outputs.pr_number }} \
          --remove-label='autorelease: tagged' \
          --add-label='autorelease: published'
