name: build
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_call:
    inputs:
      tag-name:
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.ref_name == github.event.repository.default_branch && fromJson('["dev", "release"]') || fromJson('["dev"]') }}
        platform:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          # Windows XP and later, 32-bit
          - target: i686-pc-windows-msvc
            os: windows-2022
            features: xp
          # Android's own libc (bionic): DNS goes through Android's resolver, which a
          # static musl binary cannot use
          - target: aarch64-linux-android
            os: ubuntu-24.04
    runs-on: ${{ matrix.platform.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - name: Install musl tools
        if: ${{ endsWith(matrix.platform.target, '-unknown-linux-musl') }}
        run: |
          sudo apt-get install -y musl-tools --no-install-recommends
      - name: Use the Android NDK
        if: ${{ endsWith(matrix.platform.target, '-linux-android') }}
        run: |
          # The runner image ships the NDK; API 24 (Android 7) is the oldest Rust supports
          ndk="$ANDROID_NDK_LATEST_HOME"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"  # for the vendored OpenSSL build
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Download VC-LTL5 and YY-Thunks for the XP build
        if: ${{ matrix.platform.features == 'xp' }}
        run: |
          # thunk-rs would download them itself with curl -k (no certificate check) and no
          # checksum, and link them into the release. Fetch the versions it expects here,
          # check them, and point it at them.
          cd "$RUNNER_TEMP"
          curl -fsSLo vc-ltl.7z https://github.com/Chuyu-Team/VC-LTL5/releases/download/v5.2.2/VC-LTL-Binary.7z
          curl -fsSLo yy-thunks.zip https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.1.7/YY-Thunks-Objs.zip
          printf '%s  %s\n' \
            04aa46a7d2af655bcf42c4937504525eb7e66a75910ed42fd25a1cdcec587df0 vc-ltl.7z \
            c3066f3f074ebc2a89b2def5f427bdea238dee17349d2bab579af519781691ab yy-thunks.zip |
            sha256sum -c -
          7z x -y -ovc-ltl vc-ltl.7z > /dev/null
          7z x -y -oyy-thunks yy-thunks.zip > /dev/null
          dir=$(cygpath -w "$RUNNER_TEMP")
          echo "VC_LTL=$dir\\vc-ltl" >> "$GITHUB_ENV"
          echo "YY_THUNKS=$dir\\yy-thunks" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: tree:0
          fetch-depth: 0
      - run: |
          rustup target add ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: ${{ matrix.profile }}-${{ matrix.platform.target }}
      - run: cargo build --locked --bins ${{ matrix.profile == 'release' && '--release' || '' }} --target ${{ matrix.platform.target }} ${{ matrix.platform.features && format('--no-default-features --features {0}', matrix.platform.features) || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.profile }}-${{ matrix.platform.target }}
          path: |
            target/${{ matrix.platform.target }}/debug/pcsc-rs
            target/${{ matrix.platform.target }}/debug/pcsc-rs.exe
            target/${{ matrix.platform.target }}/release/pcsc-rs
            target/${{ matrix.platform.target }}/release/pcsc-rs.exe
          if-no-files-found: error
      - name: Upload to release
        if: ${{ inputs.tag-name && matrix.profile == 'release' }}
        working-directory: target/${{ matrix.platform.target }}/release/
        run: |
          if [ -e pcsc-rs.exe ]; then
            filename="pcsc-rs-${{ inputs.tag-name }}-${{ matrix.platform.target }}.exe"
            mv pcsc-rs.exe "$filename"
            gh release upload ${{ inputs.tag-name }} "$filename"#${{ matrix.platform.target }} --clobber
          else
            filename="pcsc-rs-${{ inputs.tag-name }}-${{ matrix.platform.target }}"
            mv pcsc-rs "$filename"
            gh release upload ${{ inputs.tag-name }} "$filename"#${{ matrix.platform.target }} --clobber
          fi
