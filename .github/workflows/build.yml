name: build
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_call:
    inputs:
      tag-name:
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.ref_name == github.event.repository.default_branch && fromJson('["dev", "release"]') || fromJson('["dev"]') }}
        platform:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          # Windows XP and later, 32-bit
          - target: i686-pc-windows-msvc
            os: windows-2022
            features: xp
          # Android 5.0+ 64-bit ARM (API 21 baseline). The same rustls-only Android
          # feature is used for old-device ADB installs, so it does not self-update.
          - target: aarch64-linux-android
            os: ubuntu-24.04
            features: android-legacy
          - target: armv7-linux-androideabi
            os: ubuntu-24.04
            features: android-legacy
          # Static ARM binaries for Android 2.3.3+ ADB installs and the legacy APK.
          # arm uses the ARMv6 ISA; armv7 has a faster build for N-06C and other ARMv7 devices.
          - target: arm-unknown-linux-musleabi
            os: ubuntu-24.04
            features: android-legacy
          - target: armv7-unknown-linux-musleabi
            os: ubuntu-24.04
            features: android-legacy
    runs-on: ${{ matrix.platform.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - name: Install musl tools
        if: ${{ endsWith(matrix.platform.target, '-unknown-linux-musl') && matrix.platform.features != 'android-legacy' }}
        run: |
          sudo apt-get install -y musl-tools --no-install-recommends
      - name: Use the Android NDK
        if: ${{ contains(matrix.platform.target, '-linux-android') }}
        run: |
          # The runner image ships the NDK. API 21 supports Android 5.0 through 6.x.
          ndk="$ANDROID_NDK_LATEST_HOME"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case '${{ matrix.platform.target }}' in
            aarch64-linux-android) clang=aarch64-linux-android21-clang ;;
            armv7-linux-androideabi) clang=armv7a-linux-androideabi21-clang ;;
          esac
          triple='${{ matrix.platform.target }}'
          lower="${triple//-/_}"
          upper="$(echo "$lower" | tr a-z A-Z)"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"  # for the vendored OpenSSL build
          echo "CC_${lower}=$bin/$clang" >> "$GITHUB_ENV"
          echo "AR_${lower}=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${upper}_LINKER=$bin/$clang" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Download VC-LTL5 and YY-Thunks for the XP build
        if: ${{ matrix.platform.features == 'xp' }}
        run: |
          # thunk-rs would download them itself with curl -k (no certificate check) and no
          # checksum, and link them into the release. Fetch the versions it expects here,
          # check them, and point it at them.
          cd "$RUNNER_TEMP"
          curl -fsSLo vc-ltl.7z https://github.com/Chuyu-Team/VC-LTL5/releases/download/v5.2.2/VC-LTL-Binary.7z
          curl -fsSLo yy-thunks.zip https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.1.7/YY-Thunks-Objs.zip
          printf '%s  %s\n' \
            04aa46a7d2af655bcf42c4937504525eb7e66a75910ed42fd25a1cdcec587df0 vc-ltl.7z \
            c3066f3f074ebc2a89b2def5f427bdea238dee17349d2bab579af519781691ab yy-thunks.zip |
            sha256sum -c -
          7z x -y -ovc-ltl vc-ltl.7z > /dev/null
          7z x -y -oyy-thunks yy-thunks.zip > /dev/null
          dir=$(cygpath -w "$RUNNER_TEMP")
          echo "VC_LTL=$dir\\vc-ltl" >> "$GITHUB_ENV"
          echo "YY_THUNKS=$dir\\yy-thunks" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: tree:0
          fetch-depth: 0
      - name: Install Cross
        if: ${{ endsWith(matrix.platform.target, '-musleabi') }}
        run: cargo install cross --locked --version 0.2.5
      - run: |
          rustup target add ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: ${{ matrix.profile }}-${{ matrix.platform.target }}
      - name: Build binary
        run: |
          if [[ '${{ matrix.platform.target }}' == *-musleabi ]]; then
            cross build --locked --bins ${{ matrix.profile == 'release' && '--release' || '' }} \
              --target ${{ matrix.platform.target }} --no-default-features --features android-legacy
          else
            cargo build --locked --bins ${{ matrix.profile == 'release' && '--release' || '' }} \
              --target ${{ matrix.platform.target }} ${{ matrix.platform.features && format('--no-default-features --features {0}', matrix.platform.features) || '' }}
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.profile }}-${{ matrix.platform.target }}
          path: |
            target/${{ matrix.platform.target }}/debug/pcsc-rs
            target/${{ matrix.platform.target }}/debug/pcsc-rs.exe
            target/${{ matrix.platform.target }}/release/pcsc-rs
            target/${{ matrix.platform.target }}/release/pcsc-rs.exe
          if-no-files-found: error
      - name: Upload to release
        if: ${{ inputs.tag-name && matrix.profile == 'release' }}
        working-directory: target/${{ matrix.platform.target }}/release/
        run: |
          if [ -e pcsc-rs.exe ]; then
            filename="mimizk-rs-${{ inputs.tag-name }}-${{ matrix.platform.target }}.exe"
            mv pcsc-rs.exe "$filename"
            gh release upload ${{ inputs.tag-name }} "$filename"#${{ matrix.platform.target }} --clobber
          else
            filename="mimizk-rs-${{ inputs.tag-name }}-${{ matrix.platform.target }}"
            mv pcsc-rs "$filename"
            gh release upload ${{ inputs.tag-name }} "$filename"#${{ matrix.platform.target }} --clobber
          fi

  # The current Android app and the API 10 legacy app.
  # Runs each build against a stand-in PC Status server and checks every status it sends
  # (.github/e2e/run.py). The runners have no real GPU, but the code that looks for one
  # still runs: DXGI and the performance counters on Windows, ioreg on macOS.
  e2e:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          # The XP build, on a current Windows
          - target: i686-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-${{ matrix.platform.target }}
          path: client
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install websockets==17.2
      - name: Run the client against a stand-in server
        run: |
          client=client/debug/pcsc-rs
          [ -e "$client.exe" ] && client="$client.exe"
          chmod +x "$client"
          python .github/e2e/run.py --client "$client" --hostname "e2e-${{ matrix.platform.target }}"

  # The Android app (android/): the aarch64-linux-android client inside an APK, run with root or Shizuku
  android-app:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PROFILE: ${{ github.ref_name == github.event.repository.default_branch && 'release' || 'dev' }}
    defaults:
      run:
        shell: bash -xe {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PROFILE }}-aarch64-linux-android
          path: client
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PROFILE }}-arm-unknown-linux-musleabi
          path: client-armv6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PROFILE }}-armv7-unknown-linux-musleabi
          path: client-armv7
      - name: Put the client in the APK
        run: |
          profile=$([ "$PROFILE" = release ] && echo release || echo debug)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "client/$profile/pcsc-rs" android/app/src/main/jniLibs/arm64-v8a/libpcsc.so
          mkdir -p android/legacy/src/main/assets/bin/armeabi android/legacy/src/main/assets/bin/armeabi-v7a
          cp "client-armv6/$profile/pcsc-rs" android/legacy/src/main/assets/bin/armeabi/pcsc-rs
          cp "client-armv7/$profile/pcsc-rs" android/legacy/src/main/assets/bin/armeabi-v7a/pcsc-rs
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Signing key
        # Only for main and releases: a pull request's APK (code not reviewed yet) is signed
        # with a debug key, so it can never pass for a release
        if: ${{ github.event_name != 'pull_request' }}
        # No -x: the trace would print the key
        shell: bash -e {0}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon :app:assembleRelease :legacy:assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PROFILE }}-android-app
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PROFILE }}-android-legacy-app
          path: android/legacy/build/outputs/apk/release/legacy-release.apk
          if-no-files-found: error
      - name: Upload to release
        if: ${{ inputs.tag-name && env.PROFILE == 'release' }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "Android signing key is not configured; skipping APK release upload."
            exit 0
          fi
          filename="mimizk-rs-${{ inputs.tag-name }}-android.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$filename"
          gh release upload ${{ inputs.tag-name }} "$filename"#android-app --clobber
          legacy="mimizk-rs-${{ inputs.tag-name }}-android-legacy.apk"
          mv android/legacy/build/outputs/apk/release/legacy-release.apk "$legacy"
          gh release upload ${{ inputs.tag-name }} "$legacy"#android-legacy-app --clobber
